<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" font-family="Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-gas" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F4E78"/>
    </marker>
    <marker id="arr-liq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F7A4E"/>
    </marker>
    <marker id="arr-sol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7A1F1F"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1100" fill="white"/>

  <!-- Title -->
  <text x="800" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1F4E78">
    Block Flow Diagram — Pre-1937 Seattle Gas Works Coal Gasification Plant (Lake Station)
  </text>
  <text x="800" y="58" font-size="14" font-style="italic" text-anchor="middle" fill="#444">
    Production target: 170,000 Nm³/day city gas at 0 °C, 1 atm
  </text>

  <!-- Aspen Plus V14 simulation boundary -->
  <rect x="375" y="270" width="900" height="490"
        fill="none" stroke="#1F4E78" stroke-width="3" stroke-dasharray="14,8" rx="10"/>
  <text x="380" y="262" font-size="14" font-weight="bold" fill="#1F4E78">
    Aspen Plus V14 Simulation Boundary (run-phase, time-averaged)
  </text>

  <!-- ===== ROW 1: PLANT INLETS ===== -->
  <!-- Y-101 Coal Yard -->
  <g>
    <rect x="40" y="100" width="170" height="60" fill="#FFF2CC" stroke="#7F6000" stroke-width="2" rx="4"/>
    <text x="125" y="125" font-size="13" font-weight="bold" text-anchor="middle">Y-101</text>
    <text x="125" y="145" font-size="12" text-anchor="middle">Coal yard / trackage</text>
  </g>
  <!-- Lake Union water -->
  <g>
    <rect x="40" y="220" width="170" height="50" fill="#DDEBF7" stroke="#1F4E78" stroke-width="2" rx="4"/>
    <text x="125" y="245" font-size="12" font-weight="bold" text-anchor="middle">Lake Union water (S-104)</text>
    <text x="125" y="262" font-size="11" text-anchor="middle">10 °C, 6,250 kg/h</text>
  </g>
  <!-- Air -->
  <g>
    <rect x="40" y="320" width="170" height="50" fill="#DDEBF7" stroke="#1F4E78" stroke-width="2" rx="4"/>
    <text x="125" y="345" font-size="12" font-weight="bold" text-anchor="middle">Air (S-106)</text>
    <text x="125" y="362" font-size="11" text-anchor="middle">25 °C, 8,300 kg/h</text>
  </g>

  <!-- ===== ROW 2: FRONT-END (RETORTS, COKE OVENS, BOILER) ===== -->
  <!-- B-101 Boiler -->
  <g>
    <rect x="240" y="220" width="120" height="50" fill="#FFF2CC" stroke="#7F6000" stroke-width="2" rx="4"/>
    <text x="300" y="240" font-size="12" font-weight="bold" text-anchor="middle">B-101</text>
    <text x="300" y="258" font-size="11" text-anchor="middle">Boiler plant</text>
  </g>
  <!-- R-101 Retorts -->
  <g>
    <rect x="240" y="100" width="120" height="60" fill="#FFF2CC" stroke="#7F6000" stroke-width="2" rx="4"/>
    <text x="300" y="125" font-size="12" font-weight="bold" text-anchor="middle">R-101</text>
    <text x="300" y="143" font-size="11" text-anchor="middle">144 horiz.</text>
    <text x="300" y="156" font-size="11" text-anchor="middle">retorts</text>
  </g>
  <!-- R-102 Coke Ovens -->
  <g>
    <rect x="240" y="180" width="120" height="35" fill="#FFF2CC" stroke="#7F6000" stroke-width="2" rx="4"/>
    <text x="300" y="195" font-size="12" font-weight="bold" text-anchor="middle">R-102 Coke ovens</text>
    <text x="300" y="208" font-size="10" text-anchor="middle">20 chambers, 6.5 t each</text>
  </g>
  <!-- R-103 Producer gas -->
  <g>
    <rect x="240" y="320" width="120" height="50" fill="#FFF2CC" stroke="#7F6000" stroke-width="2" rx="4"/>
    <text x="300" y="340" font-size="12" font-weight="bold" text-anchor="middle">R-103</text>
    <text x="300" y="358" font-size="11" text-anchor="middle">Producer-gas furnace</text>
  </g>

  <!-- ===== ROW 3: GASIFIER + COOLING (ASPEN BOUNDARY) ===== -->
  <!-- R-201 Water Gas Machines -->
  <g>
    <rect x="400" y="295" width="170" height="80" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="485" y="320" font-size="13" font-weight="bold" text-anchor="middle">R-201</text>
    <text x="485" y="340" font-size="11" text-anchor="middle">Water-gas machines (×6)</text>
    <text x="485" y="356" font-size="11" text-anchor="middle">RGIBBS, 1050 °C, 1.1 bar</text>
    <text x="485" y="370" font-size="10" font-style="italic" text-anchor="middle">cyclic blow/run averaged</text>
  </g>
  <!-- Mixer node for raw gas header -->
  <g>
    <rect x="610" y="305" width="100" height="60" fill="#FCE4D6" stroke="#7F2F00" stroke-width="2" rx="4"/>
    <text x="660" y="328" font-size="12" font-weight="bold" text-anchor="middle">Raw gas</text>
    <text x="660" y="345" font-size="11" text-anchor="middle">header</text>
    <text x="660" y="360" font-size="10" text-anchor="middle">(mix S-201,S-202)</text>
  </g>
  <!-- E-201 Cooler -->
  <g>
    <rect x="750" y="305" width="120" height="60" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="810" y="328" font-size="12" font-weight="bold" text-anchor="middle">E-201</text>
    <text x="810" y="345" font-size="11" text-anchor="middle">Primary cooler/</text>
    <text x="810" y="360" font-size="11" text-anchor="middle">condenser → 40 °C</text>
  </g>
  <!-- C-201 Exhauster -->
  <g>
    <rect x="910" y="305" width="100" height="60" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="960" y="328" font-size="12" font-weight="bold" text-anchor="middle">C-201</text>
    <text x="960" y="348" font-size="11" text-anchor="middle">Exhauster</text>
    <text x="960" y="363" font-size="10" text-anchor="middle">blower (COMPR)</text>
  </g>

  <!-- ===== ROW 4: CLEANUP TRAIN ===== -->
  <!-- T-301 NH3 wash -->
  <g>
    <rect x="430" y="450" width="120" height="60" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="490" y="472" font-size="12" font-weight="bold" text-anchor="middle">T-301</text>
    <text x="490" y="490" font-size="11" text-anchor="middle">NH₃ washers</text>
    <text x="490" y="503" font-size="10" text-anchor="middle">(SEP)</text>
  </g>
  <!-- ESP-301 Cottrell -->
  <g>
    <rect x="580" y="450" width="120" height="60" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="640" y="472" font-size="12" font-weight="bold" text-anchor="middle">ESP-301</text>
    <text x="640" y="490" font-size="11" text-anchor="middle">Cottrell ESP</text>
    <text x="640" y="503" font-size="10" text-anchor="middle">(tar mist, SEP)</text>
  </g>
  <!-- T-302 Light Oil -->
  <g>
    <rect x="730" y="450" width="120" height="60" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="790" y="472" font-size="12" font-weight="bold" text-anchor="middle">T-302</text>
    <text x="790" y="490" font-size="11" text-anchor="middle">Light-oil absorber</text>
    <text x="790" y="503" font-size="10" text-anchor="middle">(BTX, SEP)</text>
  </g>
  <!-- P-301 FeOx -->
  <g>
    <rect x="880" y="450" width="120" height="60" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="940" y="472" font-size="12" font-weight="bold" text-anchor="middle">P-301</text>
    <text x="940" y="490" font-size="11" text-anchor="middle">FeOx dry-box</text>
    <text x="940" y="503" font-size="10" text-anchor="middle">purifier (SEP)</text>
  </g>
  <!-- V-301 Decanter -->
  <g>
    <rect x="430" y="600" width="160" height="60" fill="#E2EFDA" stroke="#375623" stroke-width="2" rx="4"/>
    <text x="510" y="622" font-size="12" font-weight="bold" text-anchor="middle">V-301</text>
    <text x="510" y="640" font-size="11" text-anchor="middle">Tar/liquor decanter</text>
    <text x="510" y="654" font-size="10" text-anchor="middle">(FLASH2)</text>
  </g>

  <!-- ===== STORAGE & DISTRIBUTION ===== -->
  <!-- H-401 Relief Holder -->
  <g>
    <rect x="1100" y="295" width="170" height="55" fill="#FFF2CC" stroke="#7F6000" stroke-width="2" rx="4"/>
    <text x="1185" y="318" font-size="12" font-weight="bold" text-anchor="middle">H-401 Relief holder</text>
    <text x="1185" y="335" font-size="11" text-anchor="middle">502,000 ft³ (14,200 Nm³)</text>
  </g>
  <!-- H-402 Storage Holder -->
  <g>
    <rect x="1300" y="295" width="240" height="55" fill="#FFF2CC" stroke="#7F6000" stroke-width="2" rx="4"/>
    <text x="1420" y="318" font-size="12" font-weight="bold" text-anchor="middle">H-402 Storage holder</text>
    <text x="1420" y="335" font-size="11" text-anchor="middle">2,000,000 ft³ (56,635 Nm³)</text>
  </g>
  <!-- City gas distribution -->
  <g>
    <rect x="1300" y="400" width="240" height="55" fill="#DAE8FC" stroke="#1F4E78" stroke-width="2" rx="4"/>
    <text x="1420" y="423" font-size="13" font-weight="bold" text-anchor="middle">City gas distribution</text>
    <text x="1420" y="442" font-size="11" text-anchor="middle">170,000 Nm³/day, 12 MJ/Nm³</text>
  </g>

  <!-- ===== WASTE / BYPRODUCT OUTLETS ===== -->
  <g>
    <rect x="100" y="800" width="180" height="50" fill="#F8CBAD" stroke="#7F2F00" stroke-width="2" rx="4"/>
    <text x="190" y="822" font-size="12" font-weight="bold" text-anchor="middle">Coal tar (S-301)</text>
    <text x="190" y="838" font-size="11" text-anchor="middle">280 kg/h → American Tar Co.</text>
  </g>
  <g>
    <rect x="320" y="800" width="200" height="50" fill="#F8CBAD" stroke="#7F2F00" stroke-width="2" rx="4"/>
    <text x="420" y="822" font-size="12" font-weight="bold" text-anchor="middle">Ammonia liquor (S-302)</text>
    <text x="420" y="838" font-size="11" text-anchor="middle">4,920 kg/h → liquor sump</text>
  </g>
  <g>
    <rect x="560" y="800" width="180" height="50" fill="#F8CBAD" stroke="#7F2F00" stroke-width="2" rx="4"/>
    <text x="650" y="822" font-size="12" font-weight="bold" text-anchor="middle">Light oil/BTX (S-304)</text>
    <text x="650" y="838" font-size="11" text-anchor="middle">100 kg/h → reclaim</text>
  </g>
  <g>
    <rect x="780" y="800" width="180" height="50" fill="#F8CBAD" stroke="#7F2F00" stroke-width="2" rx="4"/>
    <text x="870" y="822" font-size="12" font-weight="bold" text-anchor="middle">Spent FeOx (S-303)</text>
    <text x="870" y="838" font-size="11" text-anchor="middle">50 kg/h → legacy waste</text>
  </g>
  <g>
    <rect x="1000" y="800" width="180" height="50" fill="#F8CBAD" stroke="#7F2F00" stroke-width="2" rx="4"/>
    <text x="1090" y="822" font-size="12" font-weight="bold" text-anchor="middle">Ash + char (S-402)</text>
    <text x="1090" y="838" font-size="11" text-anchor="middle">711 kg/h → disposal</text>
  </g>
  <g>
    <rect x="1220" y="800" width="180" height="50" fill="#F8CBAD" stroke="#7F2F00" stroke-width="2" rx="4"/>
    <text x="1310" y="822" font-size="12" font-weight="bold" text-anchor="middle">Blow-vent gas (S-501)</text>
    <text x="1310" y="838" font-size="11" text-anchor="middle">8,780 kg/h → stack</text>
  </g>

  <!-- ===== STREAM ARROWS ===== -->
  <!-- gas: solid blue; liquid: dashed green; solid/waste: dotted dark red -->
  <g stroke-width="2" fill="none">
    <!-- S-101 coal -> retorts/coke -->
    <line x1="210" y1="130" x2="240" y2="130" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <text x="225" y="120" font-size="10" font-weight="bold" fill="#1F4E78">S-101</text>
    <line x1="210" y1="155" x2="240" y2="195" stroke="#1F4E78" marker-end="url(#arr-gas)" stroke-dasharray="2,2"/>
    <!-- S-102 coal split also down to coke ovens -->
    <text x="217" y="180" font-size="10" font-weight="bold" fill="#1F4E78">S-102</text>

    <!-- water -> boiler -->
    <line x1="210" y1="245" x2="240" y2="245" stroke="#1F7A4E" stroke-dasharray="6,4" marker-end="url(#arr-liq)"/>
    <!-- boiler steam -> gasifier -->
    <line x1="360" y1="245" x2="400" y2="320" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <text x="362" y="285" font-size="10" font-weight="bold" fill="#1F4E78">S-105 steam</text>

    <!-- air -> R-103/R-201 -->
    <line x1="210" y1="345" x2="240" y2="345" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <line x1="360" y1="345" x2="400" y2="345" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <text x="370" y="338" font-size="10" font-weight="bold" fill="#1F4E78">S-106</text>

    <!-- coke from coke ovens -> R-201 (S-103) -->
    <path d="M 360 215 C 380 215, 380 305, 400 305" stroke="#7A1F1F" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arr-sol)"/>
    <text x="345" y="270" font-size="10" font-weight="bold" fill="#7A1F1F">S-103 coke</text>

    <!-- retort/oven gas -> raw gas header (S-202) -->
    <path d="M 360 130 C 580 130, 580 305, 660 305" stroke="#1F4E78" stroke-width="2" marker-end="url(#arr-gas)"/>
    <text x="540" y="125" font-size="10" font-weight="bold" fill="#1F4E78">S-202 oven gas</text>

    <!-- R-201 -> raw gas header (S-201) -->
    <line x1="570" y1="335" x2="610" y2="335" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <text x="575" y="328" font-size="10" font-weight="bold" fill="#1F4E78">S-201</text>

    <!-- header -> E-201 -->
    <line x1="710" y1="335" x2="750" y2="335" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <!-- E-201 -> C-201 -->
    <line x1="870" y1="335" x2="910" y2="335" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <!-- C-201 -> NH3 wash -->
    <path d="M 1010 335 L 1040 335 L 1040 480 L 550 480" stroke="#1F4E78" stroke-width="2" marker-end="url(#arr-gas)"/>
    <!-- NH3 wash -> ESP -->
    <line x1="550" y1="480" x2="580" y2="480" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <!-- ESP -> Light oil -->
    <line x1="700" y1="480" x2="730" y2="480" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <!-- Light oil -> FeOx -->
    <line x1="850" y1="480" x2="880" y2="480" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <!-- FeOx -> H-401 -->
    <path d="M 1000 480 L 1080 480 L 1080 322 L 1100 322" stroke="#1F4E78" stroke-width="2" marker-end="url(#arr-gas)"/>
    <text x="1080" y="405" font-size="10" font-weight="bold" fill="#1F4E78">S-401 city gas</text>
    <!-- H-401 -> H-402 -->
    <line x1="1270" y1="322" x2="1300" y2="322" stroke="#1F4E78" marker-end="url(#arr-gas)"/>
    <!-- H-402 -> distribution -->
    <line x1="1420" y1="350" x2="1420" y2="400" stroke="#1F4E78" marker-end="url(#arr-gas)"/>

    <!-- E-201 condensate down to V-301 (S-301/S-302) -->
    <path d="M 810 365 L 810 555 L 510 555 L 510 600" stroke="#1F7A4E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-liq)"/>
    <text x="640" y="548" font-size="10" font-weight="bold" fill="#1F7A4E">tar+liquor condensate</text>

    <!-- V-301 -> tar (S-301) -->
    <path d="M 460 660 L 460 760 L 190 760 L 190 800" stroke="#1F7A4E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-liq)"/>
    <!-- V-301 -> liquor (S-302) -->
    <path d="M 560 660 L 560 760 L 420 760 L 420 800" stroke="#1F7A4E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-liq)"/>
    <!-- T-301 ammonia drop down -->
    <path d="M 490 510 L 490 555 L 540 555" stroke="#1F7A4E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-liq)"/>
    <!-- T-302 light oil drop down -->
    <path d="M 790 510 L 790 555 L 650 555 L 650 800" stroke="#1F7A4E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-liq)"/>
    <!-- P-301 spent purifier drop down -->
    <path d="M 940 510 L 940 555 L 870 555 L 870 800" stroke="#7A1F1F" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arr-sol)"/>

    <!-- R-201 ash bottom -->
    <path d="M 540 375 L 540 720 L 1090 720 L 1090 800" stroke="#7A1F1F" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arr-sol)"/>

    <!-- Blow-phase vent (cyclic) from R-201 -->
    <path d="M 570 305 L 590 285 L 1310 285 L 1310 800" stroke="#7A1F1F" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arr-sol)"/>
    <text x="900" y="278" font-size="10" font-weight="bold" fill="#7A1F1F">cyclic blow-phase vent</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(40, 920)">
    <rect width="500" height="160" fill="#FAFAFA" stroke="#888" stroke-width="1" rx="4"/>
    <text x="10" y="22" font-size="14" font-weight="bold">Legend</text>

    <line x1="20" y1="48" x2="80" y2="48" stroke="#1F4E78" stroke-width="2" marker-end="url(#arr-gas)"/>
    <text x="100" y="52" font-size="12">Gas stream (solid blue)</text>

    <line x1="20" y1="74" x2="80" y2="74" stroke="#1F7A4E" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-liq)"/>
    <text x="100" y="78" font-size="12">Liquid stream (dashed green)</text>

    <line x1="20" y1="100" x2="80" y2="100" stroke="#7A1F1F" stroke-width="2" stroke-dasharray="2,3" marker-end="url(#arr-sol)"/>
    <text x="100" y="104" font-size="12">Solid / waste stream (dotted red)</text>

    <rect x="20" y="118" width="60" height="18" fill="none" stroke="#1F4E78" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="100" y="132" font-size="12">Aspen Plus V14 simulation domain</text>

    <rect x="290" y="44" width="20" height="14" fill="#FFF2CC" stroke="#7F6000" stroke-width="1.5"/>
    <text x="320" y="56" font-size="12">Hand/historical (outside Aspen)</text>

    <rect x="290" y="70" width="20" height="14" fill="#E2EFDA" stroke="#375623" stroke-width="1.5"/>
    <text x="320" y="82" font-size="12">Aspen-modeled unit</text>

    <rect x="290" y="96" width="20" height="14" fill="#F8CBAD" stroke="#7F2F00" stroke-width="1.5"/>
    <text x="320" y="108" font-size="12">Byproduct / waste outlet</text>

    <rect x="290" y="122" width="20" height="14" fill="#DAE8FC" stroke="#1F4E78" stroke-width="1.5"/>
    <text x="320" y="134" font-size="12">Plant inlet / final product</text>
  </g>

  <!-- Notes box -->
  <g transform="translate(580, 920)">
    <rect width="980" height="160" fill="#FAFAFA" stroke="#888" stroke-width="1" rx="4"/>
    <text x="10" y="22" font-size="14" font-weight="bold">Design point and key references</text>
    <text x="10" y="48" font-size="12">• Coal: Renton/Newcastle sub-bituminous, 7,100 kg/h AR (full plant); 4,600 kg/h coke to water-gas machines.</text>
    <text x="10" y="68" font-size="12">• Steam: 6,250 kg/h at 10.3 bar, 184 °C (saturated). Air: 8,300 kg/h cyclic-averaged blow-phase feed.</text>
    <text x="10" y="88" font-size="12">• Gasifier: 1,050 °C, 1.1 bar; restricted RGIBBS product list. Cooler outlet 40 °C; clean-gas 25 °C, 1 atm.</text>
    <text x="10" y="108" font-size="12">• Mass closure 0.87 % (target &lt; 2 %); energy closure 0 % by construction (target &lt; 5 %); cold-gas η = 66 %.</text>
    <text x="10" y="128" font-size="12">• Sources: F.H. 6545 (1933); Eggers (1998); Murphy et al. (2005); Higman &amp; van der Burgt (2008); Sawyer (2020).</text>
    <text x="10" y="148" font-size="12" font-style="italic">Figure for CHEME 486 Report #2 (Heien, May 1, 2026). Block flow diagram convention per Parisher &amp; Rhea (2012).</text>
  </g>

</svg>
